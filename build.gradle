plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}
version = '1.0.0'
group = 'com.fixpot47'
base { archivesName = 'bedrock-skeleton' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.163.0+26.3'
}
loom { splitEnvironmentSourceSets(); mods { bedrock_skeleton { sourceSet sourceSets.main; sourceSet sourceSets.client } } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
processResources { filesMatching('fabric.mod.json') { expand version: project.version } }
